name: Build Ejectify for A1989 Intel Mac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Ejectify App
        run: |
          xcodebuild archive \
            -project Ejectify.xcodeproj \
            -scheme Ejectify \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64" \
            -archivePath build/Ejectify.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p output
          cp -R build/Ejectify.xcarchive/Products/Applications/Ejectify.app output/
          cd output && zip -r Ejectify-A1989-Intel.zip Ejectify.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ejectify-A1989-Intel
          path: output/Ejectify-A1989-Intel.zip
