name: Build Ejectify for A1989 Intel Mac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Remove legacy LaunchAtLogin build script
        run: |
          python3 -c "
          path = 'Ejectify.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              lines = f.readlines()
          new_lines = []
          for line in lines:
              if 'copy-helper-swiftpm.sh' in line:
                  new_lines.append('\t\t\tshellScript = \"exit 0;\\\\n\";\n')
              else:
                  new_lines.append(line)
          with open(path, 'w') as f:
              f.writelines(new_lines)
          "
          echo "Verified project file:"
          grep "shellScript" Ejectify.xcodeproj/project.pbxproj

      - name: Build Ejectify App
        run: |
          xcodebuild build \
            -project Ejectify.xcodeproj \
            -scheme Ejectify \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

          # 寻找生成的 Ejectify.app 并打包
          APP_PATH=$(find build -name "Ejectify.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Ejectify.app not found"
            exit 1
          fi

          mkdir -p output
          cp -R "$APP_PATH" output/
          cd output && zip -r Ejectify-A1989-Intel.zip Ejectify.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ejectify-A1989-Intel
          path: output/Ejectify-A1989-Intel.zip
