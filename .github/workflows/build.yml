name: Build Ejectify for A1989 Intel Mac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Ejectify App
        run: |
          xcodebuild build \
            -project Ejectify.xcodeproj \
            -scheme Ejectify \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

          mkdir -p output
          cp -R build/Build/Products/Release/Ejectify.app output/
          cd output && zip -r Ejectify-A1989-Intel.zip Ejectify.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ejectify-A1989-Intel
          path: output/Ejectify-A1989-Intel.zip
